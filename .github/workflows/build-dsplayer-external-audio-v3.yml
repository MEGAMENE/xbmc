name: Build DSPlayer external audio v3

on:
  push:
    branches:
      - dsplayer-external-audio
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply DSPlayer source changes
        shell: pwsh
        run: ./tools/buildsteps/windows/apply-dsplayer-external-audio.ps1

      - name: Download Kodi Windows build dependencies
        shell: cmd
        run: tools\buildsteps\windows\download-dependencies.bat x64 win32

      - name: Install pkg-config for FFmpeg
        shell: pwsh
        run: |
          choco install pkgconfiglite --version=0.28 -y --no-progress
          $pkg = Get-Command pkg-config.exe -ErrorAction Stop
          Write-Host "Using pkg-config: $($pkg.Source)"
          & $pkg.Source --version

      - name: Initialize Visual Studio x64 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio installation not found"
          }

          Write-Host "Using Visual Studio: $vsPath"
          $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat not found: $devCmd"
          }

          cmd /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                "$($matches[1])=$($matches[2])" | Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append -Encoding utf8
              }
            }

      - name: Avoid Git POSIX linker shadowing MSVC linker
        shell: pwsh
        run: |
          $gitLink = Join-Path $env:ProgramFiles 'Git\usr\bin\link.exe'
          if (Test-Path $gitLink) {
            $disabled = "$gitLink.disabled"
            if (Test-Path $disabled) {
              Remove-Item $disabled -Force
            }
            Move-Item $gitLink $disabled -Force
            Write-Host "Disabled Git POSIX linker: $gitLink"
          }

          Write-Host 'Tool resolution after Visual Studio initialization:'
          where.exe cl.exe
          where.exe link.exe
          where.exe lib.exe

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T host=x64 -DENABLE_INTERNAL_CURL=OFF -DENABLE_INTERNAL_FFMPEG=ON

      - name: Build Kodi
        shell: cmd
        run: cmake --build build --config Release -- /m:2

      - name: Capture FFmpeg configure log on failure
        if: failure()
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Path build -Recurse -Filter config.log -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\ffbuild\\config\.log$' }
          if (-not $logs) {
            Write-Host 'No FFmpeg config.log found.'
            exit 0
          }
          foreach ($log in $logs) {
            Write-Host "=== $($log.FullName) ==="
            Get-Content -Raw $log.FullName
          }

      - name: Upload FFmpeg configure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-logs
          path: build/**/ffbuild/config.log
          if-no-files-found: ignore

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build/Release/Kodi.exe'
          if (-not (Test-Path $exe)) {
            Write-Error 'Kodi.exe was not produced.'
            Get-ChildItem build/Release -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload patched Kodi executable
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-DSPlayer-external-audio-v3
          path: build/Release/Kodi.exe
          if-no-files-found: error
