name: Build DSPlayer external audio v2

on:
  push:
    branches:
      - dsplayer-external-audio
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply external-audio source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $h = 'xbmc/cores/DSPlayer/StreamsManager.h'
          $hText = Get-Content -Raw $h
          $needle = '  uint32_t                m_iSampleRate; ///< Audio samplerate'
          $replacement = $needle + "`r`n  bool                    m_external = false; ///< External audio sidecar"
          if (-not $hText.Contains($replacement)) {
            if (-not $hText.Contains($needle)) { throw "StreamsManager.h anchor not found" }
            $hText = $hText.Replace($needle, $replacement)
          }
          $needle = '  void LoadStreams();'
          $replacement = $needle + "`r`n`r`n  /// Discover and add Kodi external audio files after the DirectShow graph is complete`r`n  void LoadExternalAudio();"
          if (-not $hText.Contains('void LoadExternalAudio();')) {
            if (-not $hText.Contains($needle)) { throw "LoadStreams declaration not found" }
            $hText = $hText.Replace($needle, $replacement)
          }
          Set-Content -Encoding UTF8 -NoNewline $h $hText

          $cpp = 'xbmc/cores/DSPlayer/StreamsManager.cpp'
          $cppText = Get-Content -Raw $cpp
          $needle = '  : m_strCodecName(""), m_iBitRate(0), m_iSampleRate(0)'
          $replacement = '  : m_strCodecName(""), m_iBitRate(0), m_iSampleRate(0), m_external(false)'
          if (-not $cppText.Contains($replacement)) {
            if (-not $cppText.Contains($needle)) { throw "Audio constructor anchor not found" }
            $cppText = $cppText.Replace($needle, $replacement)
          }

          $needle = "  if (m_pIAMStreamSelect)`r`n  {"
          $replacement = "  if (m_pIAMStreamSelect && !m_audioStreams[disableIndex]->m_external`r`n      && !m_audioStreams[enableIndex]->m_external)`r`n  {"
          if (-not $cppText.Contains('m_audioStreams[disableIndex]->m_external')) {
            if (-not $cppText.Contains($needle)) { throw "IAMStreamSelect anchor not found" }
            $cppText = $cppText.Replace($needle, $replacement)
          }

          $anchor = "  SubtitleManager->SetSubtitleVisible(CMediaSettings::GetInstance().GetCurrentVideoSettings().m_SubtitleOn);`r`n}`r`n`r`nint CStreamsManager::GetSubtitle()"
          $function = @'

void CStreamsManager::LoadExternalAudio()
{
  if (!m_init || m_audioStreams.empty() || !m_pGraphBuilder)
    return;

  std::vector<std::string> audioFiles;
  CUtil::ScanForExternalAudio(g_application.CurrentFile(), audioFiles);

  if (audioFiles.empty())
    return;

  const auto& audioPath = audioFiles.front();
  std::string sourcePath = CDSFile::SmbToUncPath(audioPath);
  if (StringUtils::StartsWithNoCase(sourcePath, "special://"))
    sourcePath = CSpecialProtocol::TranslatePath(sourcePath);

  std::wstring sourcePathW;
  g_charsetConverter.utf8ToW(sourcePath, sourcePathW);

  Com::SComPtr<IBaseFilter> sourceFilter;
  HRESULT hr = m_pGraphBuilder->AddSourceFilter(sourcePathW.c_str(), L"DSPlayer External Audio", &sourceFilter);
  if (FAILED(hr) || !sourceFilter)
  {
    CLog::Log(LOGWARNING, "{} Failed to add external audio source '{}' (0x{:08X})",
              __FUNCTION__, audioPath.c_str(), static_cast<unsigned>(hr));
    return;
  }

  Com::SComPtr<IPin> audioPin;
  AM_MEDIA_TYPE* audioMediaType = nullptr;

  BeginEnumPins(sourceFilter, pEP, pPin)
  {
    PIN_DIRECTION direction;
    if (FAILED(pPin->QueryDirection(&direction)) || direction != PINDIR_OUTPUT)
      continue;

    BeginEnumMediaTypes(pPin, pET, pMediaType)
    {
      if (pMediaType->majortype == MEDIATYPE_Audio)
      {
        audioPin = pPin;
        audioMediaType = CreateMediaType(pMediaType);
        break;
      }
    }
    EndEnumMediaTypes(pMediaType)

    if (audioPin)
      break;
  }
  EndEnumPins

  if (!audioPin || !audioMediaType)
  {
    CLog::Log(LOGWARNING, "{} No audio output found in external file '{}'",
              __FUNCTION__, audioPath.c_str());
    m_pGraphBuilder->RemoveFilter(sourceFilter);
    return;
  }

  auto* external = new CDSStreamDetailAudio();
  MediaTypeToStreamDetail(audioMediaType, *external);
  DeleteMediaType(audioMediaType);

  external->pObj = audioPin;
  external->pUnk = nullptr;
  external->flags = 0;
  external->connected = false;
  external->m_external = true;
  external->displayname = StringUtils::Format("External: {}", URIUtils::GetFileName(audioPath));

  const int index = static_cast<int>(m_audioStreams.size());
  m_audioStreams.push_back(external);

  CLog::Log(LOGINFO, "{} External audio stream found: {}", __FUNCTION__, audioPath.c_str());
  SetAudioStream(index);
}

'@
          if (-not $cppText.Contains('void CStreamsManager::LoadExternalAudio()')) {
            if (-not $cppText.Contains($anchor)) { throw "LoadStreams insertion anchor not found" }
            $cppText = $cppText.Replace($anchor, "  SubtitleManager->SetSubtitleVisible(CMediaSettings::GetInstance().GetCurrentVideoSettings().m_SubtitleOn);`r`n}`r`n" + $function + "int CStreamsManager::GetSubtitle()")
          }
          Set-Content -Encoding UTF8 -NoNewline $cpp $cppText

          $player = 'xbmc/cores/DSPlayer/DSPlayer.cpp'
          $playerText = Get-Content -Raw $player
          $needle = '    if (CStreamsManager::Get()) CStreamsManager::Get()->SelectBestAudio();'
          $replacement = $needle + "`r`n    if (CStreamsManager::Get()) CStreamsManager::Get()->LoadExternalAudio();"
          if (-not $playerText.Contains('Get()->LoadExternalAudio()')) {
            if (-not $playerText.Contains($needle)) { throw "DSPlayer.cpp audio-selection anchor not found" }
            $playerText = $playerText.Replace($needle, $replacement)
          }
          Set-Content -Encoding UTF8 -NoNewline $player $playerText

          Write-Host 'Source changes applied successfully.'

      - name: Download Kodi Windows build dependencies
        shell: cmd
        run: tools\buildsteps\windows\download-dependencies.bat win32 win32

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T host=x64

      - name: Build Kodi
        shell: cmd
        run: cmake --build build --config Release -- /m:2

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build/Release/Kodi.exe'
          if (-not (Test-Path $exe)) {
            Write-Error 'Kodi.exe was not produced.'
            Get-ChildItem build/Release -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload patched Kodi executable
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-DSPlayer-external-audio-v2
          path: |
            build/Release/Kodi.exe
            build/Release/Kodi.pdb
          if-no-files-found: error
